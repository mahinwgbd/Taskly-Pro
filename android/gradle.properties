# AndroidX support
android.useAndroidX=true

# Jetifier is not required by Taskly's current AndroidX dependencies.
# Disabling it also avoids JetifyTransform running over Flutter engine native JARs.
android.enableJetifier=false

# Give Gradle enough heap for release APK native-library processing.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8

# Flutter Gradle migration flags
android.builtInKotlin=false
android.newDsl=false

kotlin.incremental=false
